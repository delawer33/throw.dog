name: throwdog

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: throwdog_app
    # SECURITY: приложение смотрит в интернет, поэтому в контейнер попадают
    # ТОЛЬКО его собственные переменные. Раньше здесь был `env_file: .env`,
    # который тащил в app весь .env — включая UMAMI_DB_PASSWORD и
    # UMAMI_APP_SECRET, которые приложению не нужны и утекли бы при компрометации.
    # Список-форма `- VAR` пробрасывает переменную из окружения compose
    # (авто-загружаемый .env) ТОЛЬКО если она задана; если нет — не задаётся, и
    # приложение берёт свои значения по умолчанию (см. app/main.py). Umami и
    # umami_db читают свои секреты через собственные `environment:` ниже.
    environment:
      - APP_PORT=${APP_PORT:-8000}
      # Аналитика: читаются рендером страниц (app/pages.py).
      - ANALYTICS_HOST
      - ANALYTICS_WEBSITE_ID
      # Поведение броска и гейткипера (все опциональны, дефолты в коде).
      - THROW_TTL_SECONDS
      - THROW_MAX_BYTES
      - THROW_MISS_DELAY_MS
      - THROW_GATE_TARPIT_DELAY_MS
      - THROW_SWEEP_INTERVAL_SECONDS
      - THROW_GATE_WINDOW_SECONDS
      - THROW_GATE_MISS_BUDGET
      - THROW_GATE_GLOBAL_WINDOW_SECONDS
      - THROW_GATE_GLOBAL_MISS_THRESHOLD
      - THROW_GATE_MAX_TRACKED_IPS
      - THROW_TRUSTED_PROXY
      - THROW_FORWARDED_HEADER
      - THROW_PRO_EMAILS_PATH
      - THROW_FEEDBACK_PATH
      - THROW_LOG_HMAC_SECRET
    # Порт не публикуется на хост: снаружи ходит только Caddy.
    expose:
      - "${APP_PORT:-8000}"
    # Fake-door Pro: собранные имейлы дописываются в файл на этом volume,
    # чтобы список пережил перезапуск. Путь задаётся THROW_PRO_EMAILS_PATH.
    volumes:
      - pro_data:/data
    networks:
      - throwdog_net
    # В slim-образе нет curl/wget — проверяем /healthz однострочником на python.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('APP_PORT','8000')+'/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Self-hosted Umami — cookieless product analytics on the same VPS. Served
  # behind Caddy on the analytics subdomain; never publishes a host port.
  #
  # DEPLOY GATE: umami/umami_db live behind the "analytics" compose profile, so
  # a plain `docker compose up -d` (interim/sslip.io, pre-domain) does NOT start
  # them — analytics rides with the domain. Bring them up explicitly with
  #   docker compose --profile analytics up -d
  # once the domain is set, ANALYTICS_DOMAIN points at the subdomain, and you've
  # set UMAMI_APP_SECRET / UMAMI_DB_PASSWORD (see DEPLOY.md).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.14.0
    container_name: throwdog_umami
    profiles: ["analytics"]
    depends_on:
      umami_db:
        condition: service_healthy
    environment:
      # Prisma connection string built from the DB creds below.
      # NB: compose interpolates every service (even profiled-out ones), so
      # these use empty defaults rather than `:?` — otherwise a plain app-only
      # `docker compose up` would fail on unset Umami secrets. When you DO run
      # the analytics profile, set UMAMI_DB_PASSWORD / UMAMI_APP_SECRET in .env:
      # an empty password makes postgres refuse to init and umami refuse to
      # sign, so it still fails fast at runtime, just not at parse time.
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-}@umami_db:5432/${UMAMI_DB_NAME:-umami}
      DATABASE_TYPE: postgresql
      # Signs sessions/tokens. Operator MUST set a long random value (analytics profile).
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    # Internal only — Caddy reaches it at umami:3000 over the compose network.
    expose:
      - "3000"
    networks:
      - throwdog_net
    restart: unless-stopped

  # Postgres backing Umami. Its data lives in a named volume, not the app's.
  umami_db:
    image: postgres:15.14-alpine
    container_name: throwdog_umami_db
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      # Empty default so app-only compose renders; set it for the analytics
      # profile — postgres refuses to init without a password (fail-fast).
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - throwdog_net
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    container_name: throwdog_caddy
    # Caddy depends only on the app. It does NOT depend on umami: the analytics
    # upstream is optional (analytics profile), and reverse_proxy tolerates an
    # upstream that appears later, so no hard dependency is needed.
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      # Subdomain that serves Umami. Only the domain-mode Caddyfile has a site
      # block for it; the interim Caddyfile.acme has none, so this may be empty
      # until analytics is deployed with the domain.
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN:-}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      # Какой конфиг Caddy подсунуть: боевой (Origin CA за Cloudflare) или
      # промежуточный Caddyfile.acme, пока домена нет. См. CADDYFILE в .env.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # Сертификат Cloudflare Origin CA. Лежит только на сервере, в git его нет.
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - throwdog_net
    restart: unless-stopped

networks:
  throwdog_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  umami_db_data:
  pro_data:
